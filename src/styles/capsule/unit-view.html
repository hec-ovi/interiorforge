<!doctype html><html><body style="margin:0"><script type="module">
import * as T from '/node_modules/.vite/deps/three.js';
import { cityGltfLoader } from '/src/game/data/CityGltfLoader.js';
import { bake } from '/src/game/city/GeometryBake.js';
import { RoomEnvironment } from '/node_modules/three/examples/jsm/environments/RoomEnvironment.js';
const params = new URL(location).searchParams;
const reports = await (await fetch('./units.json')).json();
const report = reports.find(report => report.set === params.get('set')) ?? reports[0];
const scene = new T.Scene(); scene.background = new T.Color('#b9c1c8');
const renderer = new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(1600,900); renderer.setPixelRatio(1);

scene.environment = pmrem.fromScene(new RoomEnvironment(),.05).texture;
scene.environmentIntensity = .25;
scene.add(new T.HemisphereLight(0xdce5ef,0x777268,.4));
const theme = await (await fetch('/@fs/work/materials/themes/cyberpunk/theme.json')).json();

  for(const [kind,target] of [['basecolor','map'],['normal','normalMap'],['roughness','roughnessMap'],['metallic','metalnessMap']]) {

loaded.updateMatrixWorld(true);const meshes=[];loaded.traverse(node=>{if(node.isMesh)meshes.push(node)});
